name: Electron portable release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web and API
        run: npm run build

      - name: Build portable zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:e:zip

      - name: Name zip by build number
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path dist_electron -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw 'Portable zip not found' }
          Rename-Item $zip.FullName "siero-tts-build-${{ github.run_number }}-win.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: siero-tts-windows-portable
          path: dist_electron/*.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_electron/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish main build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: dist_electron/*.zip
          fail_on_unmatched_files: true
