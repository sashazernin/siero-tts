<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>siero-tts</title>
    <style>
      :root {
        --color-bg-default: #0d0d12;
        --color-bg-elevated: #1e1e2a;
        --color-primary: #8b5cf6;
        --color-text-primary: #e8e8ed;
        --color-text-secondary: #9b9bab;
        --color-border: rgba(255, 255, 255, 0.08);
        --font-family: Inter, system-ui, -apple-system, sans-serif;
        --font-display: Outfit, var(--font-family);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--color-bg-default);
        color: var(--color-text-primary);
        font-family: var(--font-family);
        user-select: none;
      }

      .window {
        height: 100%;
        border: 1px solid var(--color-border);
        background:
          radial-gradient(circle at top right, rgba(139, 92, 246, 0.18), transparent 42%),
          linear-gradient(180deg, #16161f 0%, #0d0d12 100%);
        display: flex;
        flex-direction: column;
      }

      .titlebar {
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        -webkit-app-region: drag;
        flex-shrink: 0;
      }

      .close {
        -webkit-app-region: no-drag;
        width: 36px;
        height: 36px;
        border: none;
        background: transparent;
        color: var(--color-text-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .close:hover {
        background: rgba(248, 113, 113, 0.16);
        color: #f87171;
      }

      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 0 24px 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        width: 44px;
        height: 44px;
      }

      .title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 45%, #8b5cf6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .status {
        margin: 0;
        color: var(--color-text-secondary);
        font-size: 0.85rem;
      }

      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(139, 92, 246, 0.25);
        border-top-color: var(--color-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="titlebar">
        <button class="close" type="button" aria-label="Закрыть" id="close">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M1 1l10 10M11 1 1 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="content">
        <div class="brand">
          <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" aria-hidden="true">
            <rect width="512" height="512" rx="112" fill="#16161F" />
            <rect x="148" y="196" width="28" height="120" rx="14" fill="#C4B5FD" />
            <rect x="204" y="160" width="28" height="192" rx="14" fill="#C4B5FD" />
            <rect x="260" y="184" width="28" height="144" rx="14" fill="#8B5CF6" />
            <rect x="316" y="148" width="28" height="216" rx="14" fill="#8B5CF6" />
          </svg>
          <h1 class="title">siero-tts</h1>
        </div>
        <div class="spinner" aria-hidden="true"></div>
        <p class="status">Загрузка моделей Silero...</p>
      </div>
    </div>
    <script>
      document.getElementById('close').addEventListener('click', () => {
        window.loaderAPI.close();
      });
    </script>
  </body>
</html>
